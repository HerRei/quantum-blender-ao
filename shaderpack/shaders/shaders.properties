# Iris/OptiFine shader-pack settings. This file belongs inside shaders/.
screen = QMR_EXPERIMENTAL_LIGHTING QMR_MANUAL_VISIBILITY QMR_BLEND_PERCENT
sliders = QMR_MANUAL_VISIBILITY QMR_BLEND_PERCENT

# A valid, no-op smoothing seam. Official Iris expressions cannot consume the
# Fabric mod's arbitrary cache value, so this remains 1.0 until a supported
# versioned bridge is selected and tested.
uniform.float.qmrReservedVisibility = smooth(9001, 1.0, 8.0, 8.0)

