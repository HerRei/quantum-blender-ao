[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quantum-minecraft-rendering"
version = "0.1.0"
description = "Reproducible voxel ambient-visibility research service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Hermes Reisner"}]
dependencies = [
  "fastapi>=0.116,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "psutil>=7,<8",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "qiskit==2.3.1",
  "qiskit-algorithms==0.4.0",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.24,<5",
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
qmr = "qmr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qmr"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qmr"]

