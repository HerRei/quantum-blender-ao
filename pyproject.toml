[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quantum-blender-ao"
version = "0.1.0"
description = "A course-sized Blender experiment comparing exact, Monte Carlo, and simulated-QAE ambient visibility"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Hermes Reisner"}]
dependencies = [
  "pillow>=11,<13",
  "qiskit==2.3.1",
  "qiskit-algorithms==0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
qbao = "qbao.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qbao"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
